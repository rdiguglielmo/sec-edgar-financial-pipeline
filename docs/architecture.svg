  </svg>
  <text x="345" y="292" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Python</text>
  <text x="345" y="316" text-anchor="middle" font-size="14" fill="#57606a">requests, zipfile</text>
  <text x="345" y="335" text-anchor="middle" font-size="14" fill="#57606a">rate-limited client</text>

  <line x1="452" y1="205" x2="494" y2="205" stroke="#1f2328" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ 2. STORAGE ============ -->
  <text x="605" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Storage</text>
  <rect x="510" y="95" width="190" height="270" fill="none" stroke="#1f2328" stroke-width="4"/>
  <rect x="569" y="150" width="72" height="72" rx="16" fill="#FFF000"/>
  <svg x="581" y="162" width="48" height="48" viewBox="0 0 24 24">
    <path fill="#1f2328" d="M12 0C5.363 0 0 5.363 0 12s5.363 12 12 12 12-5.363 12-12S18.637 0 12 0zM9.502 7.03a4.974 4.974 0 0 1 4.97 4.97 4.974 4.974 0 0 1-4.97 4.97A4.974 4.974 0 0 1 4.532 12a4.974 4.974 0 0 1 4.97-4.97zm6.563 3.183h2.351c.98 0 1.787.782 1.787 1.762s-.807 1.789-1.787 1.789h-2.351v-3.551z"/>
  </svg>
  <text x="605" y="292" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">DuckDB</text>
  <text x="605" y="316" text-anchor="middle" font-size="14" fill="#57606a">one local file</text>
  <text x="605" y="335" text-anchor="middle" font-size="14" fill="#57606a">raw / staging / marts</text>

  <line x1="712" y1="205" x2="754" y2="205" stroke="#1f2328" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ 3. TRANSFORMATION ============ -->
  <text x="865" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Transformation</text>
  <text x="865" y="76" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">&amp; Testing</text>
  <rect x="770" y="95" width="190" height="270" fill="none" stroke="#1f2328" stroke-width="4"/>
  <rect x="829" y="150" width="72" height="72" rx="16" fill="#FF694A"/>
  <text x="865" y="199" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-1">dbt</text>
  <text x="865" y="292" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">dbt-core</text>
  <text x="865" y="316" text-anchor="middle" font-size="14" fill="#57606a">11 models, star schema</text>
  <text x="865" y="335" text-anchor="middle" font-size="14" fill="#57606a">156 quality checks</text>

  <line x1="972" y1="205" x2="1014" y2="205" stroke="#1f2328" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ 4. EXPORT ============ -->
  <text x="1125" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Export</text>
  <rect x="1030" y="95" width="190" height="270" fill="none" stroke="#1f2328" stroke-width="4"/>
  <svg x="1089" y="150" width="72" height="72" viewBox="0 0 24 24">
