  <text x="1125" y="292" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Apache Parquet</text>
  <text x="1125" y="316" text-anchor="middle" font-size="14" fill="#57606a">7 files, 1.9 MB</text>
  <text x="1125" y="335" text-anchor="middle" font-size="14" fill="#57606a">committed to the repo</text>

  <line x1="1232" y1="205" x2="1274" y2="205" stroke="#1f2328" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ 5. DASHBOARD (no box) ============ -->
  <text x="1330" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Dashboard</text>

  <!-- Power BI: ascending bars -->
  <g transform="translate(1330,186)">
    <rect x="-34" y="6"   width="17" height="30" rx="3" fill="#F2C811"/>
    <rect x="-11" y="-9"  width="17" height="45" rx="3" fill="#F2C811"/>
    <rect x="12"  y="-27" width="17" height="63" rx="3" fill="#F2C811"/>
  </g>

  <text x="1330" y="292" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Power BI</text>
  <text x="1330" y="316" text-anchor="middle" font-size="14" fill="#57606a">3 pages, one of them</text>
  <text x="1330" y="335" text-anchor="middle" font-size="14" fill="#57606a">data confidence</text>

  <!-- ============ footnote ============ -->
  <text x="720" y="412" text-anchor="middle" font-size="15" fill="#57606a">Everything runs locally: no cloud account, no services to start, no credentials.</text>
</svg>
