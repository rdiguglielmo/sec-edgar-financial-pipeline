<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SEC EDGAR pipeline architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="450" fill="#ffffff"/>
  <rect x="4" y="4" width="1432" height="442" fill="none" stroke="#1f2328" stroke-width="6"/>

  <!-- ============ SOURCE (no box) ============ -->
  <text x="112" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Source</text>

  <!-- document glyph -->
  <g transform="translate(112,205)">
    <rect x="-34" y="-46" width="60" height="78" rx="5" fill="#ffffff" stroke="#57606a" stroke-width="4"/>
    <path d="M 8 -46 L 26 -28 L 8 -28 Z" fill="#57606a"/>
    <line x1="-22" y1="-14" x2="14" y2="-14" stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
    <line x1="-22" y1="0"   x2="14" y2="0"   stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
    <line x1="-22" y1="14"  x2="4"  y2="14"  stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="112" y="310" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">SEC EDGAR</text>
  <text x="112" y="334" text-anchor="middle" font-size="14" fill="#57606a">Financial Statement</text>
  <text x="112" y="353" text-anchor="middle" font-size="14" fill="#57606a">Data Sets</text>

  <line x1="192" y1="205" x2="234" y2="205" stroke="#1f2328" stroke-width="4" marker-end="url(#arrow)"/>

